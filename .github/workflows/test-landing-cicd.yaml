name: test-landing-cicd

on:
  push:
    branches:
      - main
      - master

env:
  REGISTRY_LOGIN_SERVER: tfmplatformacr.azurecr.io
  IMAGE_NAME: test-landing

jobs:
  ci:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
          password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

      - name: Extract metadata and tags
        id: meta
        run: |
          TAGS="${{ env.REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }},${{ env.REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image to ACR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cd:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Install ArgoCD CLI
        run: |
          curl -sSL -o argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x argocd
          sudo mv ./argocd /usr/local/bin/argocd

      - name: ArgoCD login
        run: |
          argocd login "${{ secrets.ARGOCD_SERVER_URL }}" \
            --insecure \
            --grpc-web \
            --username admin \
            --password "${{ secrets.ARGOCD_PASSWORD }}"
      - name: Ensure ArgoCD app exists
        run: |
          APP_NAME="test-landing"
          REPO_URL="https://github.com/tfm-org-saguillen/test-landing.git"

          argocd app get "$APP_NAME" || argocd app create "$APP_NAME" \
            --repo "$REPO_URL" \
            --path charts/test-landing \
            --dest-namespace prod \
            --dest-server https://kubernetes.default.svc \
            --revision main \
            --sync-policy manual \
            --sync-option CreateNamespace=true

      - name: Update image in ArgoCD app
        run: |
          APP_NAME="test-landing"
          IMAGE="${{ env.REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ needs.ci.outputs.image_tag }}"

          argocd app set "$APP_NAME" \
            --helm-set image.repository="${{ env.REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}" \
            --helm-set image.tag="${{ needs.ci.outputs.image_tag }}"
      - name: Sync app in AKS
        run: |
          APP_NAME="test-landing"
          argocd app sync "$APP_NAME"
          argocd app wait "$APP_NAME" --timeout 180